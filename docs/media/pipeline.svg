<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 345" role="img" aria-labelledby="title desc"><title id="title">Anatomiden fizik davranışına</title><desc id="desc">Resmi MaleCNS verisi, seçilen koku devresi, yerel taklit eğitimi ve yürüyüş veya uçuş. Yeni anten ölçümü devreye geri döner.</desc><rect width="1200" height="345" rx="16" fill="#101923"/><g font-family="system-ui,Arial,sans-serif"><rect x="24" y="33" width="270" height="188" rx="9" fill="#162631" stroke="#2e4858"/><text x="42" y="65" fill="#71d9ca" font-size="12" letter-spacing="1.5">01 / ANATOMİ</text><text x="42" y="112" fill="#edf3f6" font-size="24" font-weight="600">MaleCNS v1.0</text><text x="42" y="152" fill="#b4c7d1" font-size="12">Resmi tablolar + gerçek kimlikler</text><text x="42" y="180" fill="#b4c7d1" font-size="12">28 örnek SWC iskeleti</text><text x="305" y="135" text-anchor="middle" fill="#71d9ca" font-size="19">→</text><rect x="318" y="33" width="270" height="188" rx="9" fill="#162631" stroke="#2e4858"/><text x="336" y="65" fill="#71d9ca" font-size="12" letter-spacing="1.5">02 / DEVRE</text><text x="336" y="112" fill="#edf3f6" font-size="24" font-weight="600">7.075 nöron</text><text x="336" y="152" fill="#b4c7d1" font-size="12">ORN → ALPN → Kenyon → MBON</text><text x="336" y="180" fill="#b4c7d1" font-size="12">Pozitif, ileri beslemeli model</text><text x="599" y="135" text-anchor="middle" fill="#71d9ca" font-size="19">→</text><rect x="612" y="33" width="270" height="188" rx="9" fill="#162631" stroke="#2e4858"/><text x="630" y="65" fill="#71d9ca" font-size="12" letter-spacing="1.5">03 / EĞİTİM</text><text x="630" y="112" fill="#edf3f6" font-size="24" font-weight="600">Yön kararını öğren</text><text x="630" y="152" fill="#b4c7d1" font-size="12">Mevcut KC→MBON çarpanları</text><text x="630" y="180" fill="#b4c7d1" font-size="12">+ yapay motor okuması</text><text x="893" y="135" text-anchor="middle" fill="#71d9ca" font-size="19">→</text><rect x="906" y="33" width="270" height="188" rx="9" fill="#162631" stroke="#2e4858"/><text x="924" y="65" fill="#71d9ca" font-size="12" letter-spacing="1.5">04 / FİZİK</text><text x="924" y="112" fill="#edf3f6" font-size="24" font-weight="600">Yürü veya uç</text><text x="924" y="152" fill="#b4c7d1" font-size="12">FlyGym: bacaklar / FlyBody: kanatlar</text><text x="924" y="180" fill="#b4c7d1" font-size="12">Hazır motor kontrolcüleri</text><path d="M1039 235v38H451v-38" fill="none" stroke="#71d9ca" stroke-width="2"/><text x="745" y="312" text-anchor="middle" fill="#99b9c5" font-size="15">Yeni anten konumları → sentetik koku → bir sonraki yön kararı</text></g></svg>