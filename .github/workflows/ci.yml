name: Package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PIPX_HOME: ${{ github.workspace }}/.ci/neural-lab-pipx
      PIPX_BIN_DIR: ${{ github.workspace }}/.ci/neural-lab-bin
      PIPX_MAN_DIR: ${{ github.workspace }}/.ci/neural-lab-man
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.14 pipx==1.7.1
      - run: uv sync --locked --group dev
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python tools/build_docs.py --check
      - run: uv run --no-sync python docs/research/verify_evidence.py
      - run: uv build
      - run: uv run --no-sync python tools/check_dist.py
      - run: uv run --no-sync python -m twine check dist/*
      - run: pipx install dist/*.whl
      - run: pipx runpip fruitfly-hashtag check
      - run: '"$PIPX_BIN_DIR/fruitfly" --version'
      - run: '"$PIPX_BIN_DIR/fruitfly" --home "$RUNNER_TEMP/neural-lab" doctor'
