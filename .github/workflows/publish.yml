name: Publish PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    # Configure the matching pending publisher on PyPI before running this job.
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.14
      - run: uv sync --locked --group dev
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python tools/build_docs.py --check
      - run: uv build
      - run: uv run --no-sync python tools/check_dist.py
      - run: uv run --no-sync python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598
