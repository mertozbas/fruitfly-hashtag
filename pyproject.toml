[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fruitfly-hashtag"
version = "0.2.1"
description = "Local Neural Lab: live fly simulation, MaleCNS circuit visualization and guided training"
readme = "docs/PYPI.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "ui/vendor/THREE-LICENSE.txt"]
authors = [{name = "Mert Özbaş / Hashtag World Company"}]
keywords = ["neuroscience", "mujoco", "fruitfly", "simulation", "malecns"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: MacOS :: MacOS X", "Operating System :: POSIX :: Linux", "Topic :: Scientific/Engineering"]
dependencies = ["uv==0.8.14"]

[project.scripts]
fruitfly = "fruitfly_lab.cli:main"

[project.urls]
Homepage = "https://github.com/mertozbas/fruitfly-hashtag"
Repository = "https://github.com/mertozbas/fruitfly-hashtag"
Issues = "https://github.com/mertozbas/fruitfly-hashtag/issues"

[dependency-groups]
dev = ["build==1.3.0", "twine==6.2.0", "Markdown==3.8.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/fruitfly_lab"]

